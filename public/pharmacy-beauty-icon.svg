<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 11 490 490" width="490" height="490" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Pharmacy and Beauty Care icon</title>
